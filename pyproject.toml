[project]
name = "marine-claims-ai"
version = "0.1.0"
description = "Open scientific benchmark suite and appraisal pipelines for marine insurance claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastembed>=0.4.0",
    "certifi>=2024.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pymarkdownlnt>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
