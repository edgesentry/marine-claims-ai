[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-claims-ai"
version = "0.1.0"
description = "Open scientific benchmark suite and appraisal pipelines for marine insurance claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "lancedb>=0.17.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.1.0",
    "fastembed>=0.4.0",
    "networkx>=3.2",
    "certifi>=2024.0.0",
    "pydantic>=2",
]

[project.scripts]
marine-claims-fetch = "marine_claims_ai.ingest.public_datasets:main"
marine-claims-index = "marine_claims_ai.index.build:main"
marine-claims-search = "marine_claims_ai.index.search:main"
marine-claims-apportion = "marine_claims_ai.analytics.apportion:main"
marine-claims-compartments = "marine_claims_ai.ontology.compartments:main"
marine-claims-eval-retrieval = "marine_claims_ai.benchmarks.retrieval_scale:main"
marine-claims-civil-coverage = "marine_claims_ai.benchmarks.civil_coverage:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pymarkdownlnt>=0.9.0",
    "pytest>=8.0.0",
    "pyright>=1.1.414",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
