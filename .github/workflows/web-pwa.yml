name: Web PWA

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "config/**"
      - ".github/workflows/web-pwa.yml"
  pull_request:
    paths:
      - "web/**"
      - "config/**"
      - ".github/workflows/web-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR + push: Vitest / Gate A / production build only.
  # Do not reference Pages/upload-artifact actions here — GitHub resolves every
  # `uses:` at job start, and unpinned transitive deps fail sha_pinning_required.
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python deps for Parquet build
        run: pip install duckdb

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & test (incl. Gate A)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run gate-a

      - name: Build static PWA
        working-directory: web
        run: npm run build

  # main only: rebuild dist + Pages upload/deploy (isolated so PRs stay clean).
  pages-artifact:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python deps for Parquet build
        run: pip install duckdb

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
