# Weekly + PR dependency vulnerability scanning via Google's OSV-Scanner
# reusable workflows. Upload SARIF to Code Scanning.
#
# Note: edgesentry org Actions allowlists may block google/osv-scanner-action
# (startup_failure). CodeQL is intentionally omitted here — use GitHub default
# CodeQL setup (Settings > Code security) so an advanced codeql.yml does not
# conflict.
name: OSV-Scanner

on:
  schedule:
    # Wednesday 00:00 UTC == Wednesday 08:00 SGT
    - cron: "0 0 * * 3"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: true

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: true
