name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # PR-only: GitHub dependency-graph diff (new/changed deps + license policy).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          comment-summary-in-pr: on-failure
          # Permissive / weak-copyleft set compatible with Apache-2.0 open-core.
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            0BSD,
            ISC,
            PSF-2.0,
            MPL-2.0,
            Zlib,
            CC0-1.0,
            MIT-CMU,
            Unlicense

  # Full installed-env audit (direct + transitive). Complements dependency-review.
  license-check:
    name: pip-licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync project with dev deps
        run: uv sync --group dev

      - name: License inventory
        run: uv run pip-licenses --from=mixed --format=markdown --order=license

      - name: Fail on strong copyleft / source-available traps
        run: >-
          uv run pip-licenses
          --from=mixed
          --partial-match
          --fail-on='GPL;AGPL;LGPL;SSPL;BUSL;Commons Clause;Elastic License;Server Side Public License'

  leak-check:
    name: Zero-Dataset leak check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch base branch for PR diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Run Zero-Dataset leak check
        run: PYTHONPATH=src python3 scripts/ci/check_zero_dataset_leak.py

  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src scripts tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync project with dev deps
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest --tb=short

  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pymarkdown
        run: pip install pymarkdownlnt

      - name: Scan tracked Markdown
        shell: bash
        run: |
          md_files=($(git ls-files '*.md'))
          if [ ${#md_files[@]} -eq 0 ]; then
            echo "No tracked Markdown files."
            exit 0
          fi
          pymarkdown --config .pymarkdown.yaml scan "${md_files[@]}"

  civil-catalog-links:
    name: Civil catalog link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync project
        run: uv sync --group dev

      - name: Install poppler for pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify catalog document URLs are alive
        run: >-
          uv run python scripts/ci/verify_civil_catalog.py
          --mode alive
          --fail-on-skip-ratio 0.25
