<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('app_title', lang) }}</title>
  <link rel="stylesheet" href="/static/demo.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">{{ t('app_title', lang) }}</div>
      <div class="badge">{{ t('offline_badge', lang) }}</div>
    </div>
    <nav class="nav">
      <a href="/uc1" class="{{ 'active' if active == 'uc1' else '' }}">{{ t('nav_uc1', lang) }}</a>
      <a href="/uc2" class="{{ 'active' if active == 'uc2' else '' }}">{{ t('nav_uc2', lang) }}</a>
      <a href="/uc3" class="{{ 'active' if active == 'uc3' else '' }}">{{ t('nav_uc3', lang) }}</a>
    </nav>
    <div class="lang">
      <a class="{{ 'active' if lang == 'en' else '' }}" href="/set-lang?lang=en&next={{ path }}">{{ t('lang_en', lang) }}</a>
      <a class="{{ 'active' if lang == 'ja' else '' }}" href="/set-lang?lang=ja&next={{ path }}">{{ t('lang_ja', lang) }}</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
