{% extends "base.html" %}
{% block content %}
<h1>{{ t('uc2_title', lang) }}</h1>
<p class="lead">{{ t('uc2_lead', lang) }}</p>

<div class="grid-2">
  <section class="panel controls"
    hx-get="/partials/uc2"
    hx-trigger="input changed delay:120ms from:input"
    hx-include="this"
    hx-target="#uc2-results"
    hx-swap="innerHTML">
    <h2>Controls</h2>
    <label>{{ t('daily_dock_rate', lang) }}
      <span class="control-val" id="v-dock">{{ uc2.daily_dock_rate }}</span>
      <input type="range" name="daily_dock_rate" min="200000" max="2000000" step="20000"
             value="{{ uc2.daily_dock_rate }}"
             oninput="document.getElementById('v-dock').textContent=this.value">
    </label>
    <label>{{ t('dock_days', lang) }}
      <span class="control-val" id="v-days">{{ uc2.dock_days }}</span>
      <input type="range" name="dock_days" min="1" max="14" step="1"
             value="{{ uc2.dock_days }}"
             oninput="document.getElementById('v-days').textContent=this.value">
    </label>
    <label>{{ t('hire_rate', lang) }}
      <span class="control-val" id="v-hire">{{ uc2.hire_rate }}</span>
      <input type="range" name="hire_rate" min="500000" max="10000000" step="100000"
             value="{{ uc2.hire_rate }}"
             oninput="document.getElementById('v-hire').textContent=this.value">
    </label>
    <label>{{ t('legacy_lead_days', lang) }}
      <span class="control-val" id="v-legacy">{{ uc2.legacy_lead_days }}</span>
      <input type="range" name="legacy_lead_days" min="3" max="40" step="1"
             value="{{ uc2.legacy_lead_days }}"
             oninput="document.getElementById('v-legacy').textContent=this.value">
    </label>
    <label>{{ t('ai_lead_minutes', lang) }}
      <span class="control-val" id="v-ai">{{ uc2.ai_lead_minutes }}</span>
      <input type="range" name="ai_lead_minutes" min="5" max="180" step="5"
             value="{{ uc2.ai_lead_minutes }}"
             oninput="document.getElementById('v-ai').textContent=this.value">
    </label>
  </section>

  <div id="uc2-results">
    {% include "partials/uc2_results.html" %}
  </div>
</div>
{% endblock %}
