<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Shield Outline (Symbolic Guardrail / Insurance) -->
  <path d="M 256 70 
           C 340 70 410 110 410 170 
           C 410 290 320 380 256 430 
           C 192 380 102 290 102 170 
           C 102 110 172 70 256 70 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Vessel Hull Profile (Marine Architecture) -->
  <!-- Bow, Keel, Stern Hull Shape -->
  <path d="M 160 270 
           L 180 320 
           Q 256 350 332 320 
           L 352 270 
           Z" 
        fill="#0284c7" 
        opacity="0.85"/>

  <path d="M 140 255 
           L 372 255 
           L 348 290 
           Q 256 315 164 290 
           Z" 
        fill="#38bdf8"/>

  <!-- Superstructure & Bridge Deck -->
  <rect x="220" y="195" width="72" height="45" rx="6" fill="#f8fafc"/>
  <rect x="236" y="160" width="40" height="35" rx="4" fill="#38bdf8"/>
  <line x1="256" y1="130" x2="256" y2="160" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>

  <!-- Radar Scanner / Sensor Waves (Neural Perception & Neuro-Symbolic) -->
  <path d="M 230 135 A 30 30 0 0 1 282 135" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 4"/>
  <path d="M 215 120 A 50 50 0 0 1 297 120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 5"/>

  <!-- Dynamic Waterline Waves -->
  <path d="M 120 355 Q 160 340 200 355 T 280 355 T 360 355 T 400 355" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M 140 375 Q 180 365 220 375 T 300 375 T 380 375" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>
